name: Validate marketplace
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: subaha_ci
          POSTGRES_USER: subaha
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U subaha -d subaha_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DEBUG: "1"
      DATABASE_URL: postgres://subaha:ci-only@localhost:5432/subaha_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r apps/backend/requirements.txt
      - run: python apps/backend/manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
        working-directory: apps/backend
      - run: python apps/backend/manage.py check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run lint
        working-directory: apps/frontend
      - run: npm run build
        working-directory: apps/frontend
